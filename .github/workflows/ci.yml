name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + Unit Tests + Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintGithubDebug lintPlayDebug :core:common:lintDebug :core:media:lintDebug :core:model:lintDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest :core:common:testDebugUnitTest :core:media:testDebugUnitTest :core:model:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APKs
        run: ./gradlew assembleGithubDebug assemblePlayDebug --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      - name: Upload GitHub Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: frameecho-github-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: frameecho-play-debug-apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
