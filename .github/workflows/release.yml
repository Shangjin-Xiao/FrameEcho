name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (used as APK versionName and artifact name, e.g. 1.0.1)'
        required: true
        default: '1.0.0'
        type: string
      publish_release:
        description: 'Automatically publish GitHub Release'
        required: false
        default: false
        type: boolean
      build_play_aab:
        description: 'Build signed Google Play AAB (Actions artifact only, never uploaded to GitHub Release)'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build Signed Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GITHUB_REPOSITORY_SLUG: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Validate release version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/frameecho-release.jks

      - name: Build GitHub Release APK (signed)
        run: |
          ./gradlew assembleGithubRelease --no-daemon --stacktrace \
            -PVERSION_NAME="$RELEASE_VERSION" \
            -PVERSION_CODE="${{ github.run_number }}" \
            -PRELEASE_STORE_FILE=$RUNNER_TEMP/frameecho-release.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="frameecho" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Build Play Release AAB (signed)
        if: ${{ inputs.build_play_aab == true }}
        run: |
          ./gradlew bundlePlayRelease --no-daemon --stacktrace \
            -PVERSION_NAME="$RELEASE_VERSION" \
            -PVERSION_CODE="${{ github.run_number }}" \
            -PRELEASE_STORE_FILE=$RUNNER_TEMP/frameecho-release.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="frameecho" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Clean up keystore
        if: always()
        run: rm -f $RUNNER_TEMP/frameecho-release.jks

      - name: Upload GitHub Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frameecho-release-apk-${{ inputs.version }}
          path: app/build/outputs/apk/github/release/app-github-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Release AAB Artifact
        if: ${{ inputs.build_play_aab == true }}
        uses: actions/upload-artifact@v7
        with:
          name: frameecho-play-aab-${{ inputs.version }}
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release notes
        if: ${{ inputs.publish_release == true }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v -x -e "$RELEASE_VERSION" -e "v$RELEASE_VERSION" | head -n 1 || true)
          echo "Previous tag: $PREV_TAG"
          python3 scripts/resolve_release_notes.py \
            --version "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/release-body.md" \
            --repo "$GITHUB_REPOSITORY_SLUG" \
            --previous-tag "$PREV_TAG"
          echo "--- release body preview ---"
          cat "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: FrameEcho ${{ inputs.version }}
          body_path: ${{ runner.temp }}/release-body.md
          files: app/build/outputs/apk/github/release/app-github-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}